server
{
    listen 80;
    server_name mesh.geekpark.ai;
    root /www/wwwroot/mesh.geekpark.ai;

    include /www/server/panel/vhost/nginx/well-known/mesh.geekpark.ai.conf;

    location /.well-known {
        allow all;
    }

    location /api/ask/stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 8m;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 512m;
    }

    access_log /www/wwwlogs/mesh.geekpark.ai.log;
    error_log /www/wwwlogs/mesh.geekpark.ai.error.log;
}
