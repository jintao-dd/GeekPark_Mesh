services:
  postgres:
    image: postgres:16-alpine
    container_name: geekpark-mesh-pg
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesh}
      POSTGRES_DB: ${POSTGRES_DB:-mesh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mesh_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mesh} -d ${POSTGRES_DB:-mesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mesh:
    image: geekpark-mesh:${MESH_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${MESH_GIT_SHA:-unknown}
        BUILD_DATE: ${MESH_BUILD_DATE:-unknown}
        IMAGE_TAG: ${MESH_IMAGE_TAG:-local}
    container_name: geekpark-mesh
    restart: unless-stopped
    env_file: .env
    environment:
      MESH_DB_URL: postgresql://${POSTGRES_USER:-mesh}:${POSTGRES_PASSWORD:-mesh}@postgres:5432/${POSTGRES_DB:-mesh}
      MESH_UVICORN_WORKERS: ${MESH_UVICORN_WORKERS:-1}
      MESH_JOB_INLINE: "0"
      MESH_ASK_LLM_CONCURRENCY: ${MESH_ASK_LLM_CONCURRENCY:-2}
      MESH_ASK_LLM_GLOBAL: ${MESH_ASK_LLM_GLOBAL:-4}
      MESH_JOB_LLM_CONCURRENCY: ${MESH_JOB_LLM_CONCURRENCY:-2}
      MESH_JOB_LLM_GLOBAL: ${MESH_JOB_LLM_GLOBAL:-2}
      MESH_PREVIEW_CARD_CONCURRENCY: ${MESH_PREVIEW_CARD_CONCURRENCY:-2}
      MESH_BUILD_GIT_SHA: ${MESH_GIT_SHA:-unknown}
      MESH_EXPECTED_GIT_SHA: ${MESH_EXPECTED_GIT_SHA:-unknown}
      MESH_IMAGE_TAG: ${MESH_IMAGE_TAG:-local}
      MESH_IMAGE_DIGEST: ${MESH_IMAGE_DIGEST:-}
      MESH_IMAGE_ID: ${MESH_IMAGE_ID:-}
    ports: ["8090:8080"]
    volumes:
      - ./data:/srv/mesh/data
    depends_on:
      postgres:
        condition: service_healthy

  mesh-worker:
    image: geekpark-mesh:${MESH_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${MESH_GIT_SHA:-unknown}
        BUILD_DATE: ${MESH_BUILD_DATE:-unknown}
        IMAGE_TAG: ${MESH_IMAGE_TAG:-local}
    container_name: geekpark-mesh-worker
    restart: unless-stopped
    env_file: .env
    environment:
      MESH_DB_URL: postgresql://${POSTGRES_USER:-mesh}:${POSTGRES_PASSWORD:-mesh}@postgres:5432/${POSTGRES_DB:-mesh}
      MESH_JOB_INLINE: "0"
      MESH_JOB_POLL_SEC: ${MESH_JOB_POLL_SEC:-1.5}
      MESH_JOB_LLM_CONCURRENCY: ${MESH_JOB_LLM_CONCURRENCY:-2}
      MESH_JOB_LLM_GLOBAL: ${MESH_JOB_LLM_GLOBAL:-2}
      MESH_PREVIEW_CARD_CONCURRENCY: ${MESH_PREVIEW_CARD_CONCURRENCY:-2}
      MESH_ASK_LLM_CONCURRENCY: "1"
      MESH_ASK_LLM_GLOBAL: "1"
      MESH_BUILD_GIT_SHA: ${MESH_GIT_SHA:-unknown}
      MESH_EXPECTED_GIT_SHA: ${MESH_EXPECTED_GIT_SHA:-unknown}
      MESH_IMAGE_TAG: ${MESH_IMAGE_TAG:-local}
      MESH_IMAGE_DIGEST: ${MESH_IMAGE_DIGEST:-}
      MESH_IMAGE_ID: ${MESH_IMAGE_ID:-}
    command: ["python", "-m", "app.job_worker"]
    volumes:
      - ./data:/srv/mesh/data
    depends_on:
      postgres:
        condition: service_healthy
      mesh:
        condition: service_started

volumes:
  mesh_pg_data:
