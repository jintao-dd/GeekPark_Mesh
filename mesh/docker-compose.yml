services:
  postgres:
    image: postgres:16-alpine
    container_name: geekpark-mesh-pg
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mesh}
      POSTGRES_DB: ${POSTGRES_DB:-mesh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mesh_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mesh} -d ${POSTGRES_DB:-mesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mesh:
    build: .
    container_name: geekpark-mesh
    restart: unless-stopped
    env_file: .env
    environment:
      MESH_DB_URL: postgresql://${POSTGRES_USER:-mesh}:${POSTGRES_PASSWORD:-mesh}@postgres:5432/${POSTGRES_DB:-mesh}
      MESH_UVICORN_WORKERS: ${MESH_UVICORN_WORKERS:-2}
      # Web 只入队；后台由 mesh-worker 执行
      MESH_JOB_INLINE: "0"
      MESH_ASK_LLM_CONCURRENCY: ${MESH_ASK_LLM_CONCURRENCY:-2}
      MESH_ASK_LLM_GLOBAL: ${MESH_ASK_LLM_GLOBAL:-4}
      MESH_JOB_LLM_CONCURRENCY: ${MESH_JOB_LLM_CONCURRENCY:-2}
      MESH_JOB_LLM_GLOBAL: ${MESH_JOB_LLM_GLOBAL:-2}
    ports: ["8090:8080"]
    volumes:
      - ./data:/srv/mesh/data
      - ./app/prompts:/srv/mesh/app/prompts
    depends_on:
      postgres:
        condition: service_healthy

  mesh-worker:
    build: .
    container_name: geekpark-mesh-worker
    restart: unless-stopped
    env_file: .env
    environment:
      MESH_DB_URL: postgresql://${POSTGRES_USER:-mesh}:${POSTGRES_PASSWORD:-mesh}@postgres:5432/${POSTGRES_DB:-mesh}
      MESH_JOB_INLINE: "0"
      MESH_JOB_POLL_SEC: ${MESH_JOB_POLL_SEC:-1.5}
      MESH_JOB_LLM_CONCURRENCY: ${MESH_JOB_LLM_CONCURRENCY:-2}
      MESH_JOB_LLM_GLOBAL: ${MESH_JOB_LLM_GLOBAL:-2}
      MESH_ASK_LLM_CONCURRENCY: "1"
      MESH_ASK_LLM_GLOBAL: "1"
    command: ["python", "-m", "app.job_worker"]
    volumes:
      - ./data:/srv/mesh/data
      - ./app/prompts:/srv/mesh/app/prompts
    depends_on:
      postgres:
        condition: service_healthy
      mesh:
        condition: service_started

volumes:
  mesh_pg_data:
